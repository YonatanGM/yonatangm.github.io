<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Yonatan Mamo</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* BODY => Clean, minimal */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    html {
      scroll-behavior: smooth;
    }

    /************************************************************
     * A) PAGE WRAPPER => Full bleed
     ************************************************************/
    .page-wrapper {
      width: 100%;
      position: relative;
    }

    /************************************************************
     * BLEND MODE TEXT HEADER - 4 corners → center convergence
     ************************************************************/
    
    body {
      position: relative;
    }
    
    /* Page wrapper - content scrolls normally */
    .page-wrapper {
      position: relative;
      z-index: 1;
    }
    
    /* Hero container - manages all fixed elements */
    .hero-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    
    /* Individual elements positioned at corners, converge to center */
    .hero-title,
    .hero-about,
    .contact-row,
    .nav-pills {
      position: fixed;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Make interactive elements clickable */
    .hero-container a,
    .hero-container button {
      pointer-events: auto;
    }

    /* NAME - Top-left corner → Center top */
    .hero-title {
      top: 3rem;
      left: 3rem;
      font-size: 2.5rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1;
      white-space: nowrap;
    }
    
    .hero-container.centered .hero-title {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -180px);
      font-size: 4rem;
    }

    .hero-title .letter {
      display: inline-block;
      opacity: 1;
    }
    
    /* CONTACT - Top-right corner → Center top */
    .contact-row {
      top: 3rem;
      right: 3rem;
      display: flex;
      gap: 1.5rem;
    }
    
    .hero-container.centered .contact-row {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -80px);
      right: auto;
      gap: 2.5rem;
    }

    .contact-row a {
      color: #ffffff;
      font-size: 24px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .hero-container.centered .contact-row a {
      font-size: 32px;
    }
    
    .contact-row a:hover {
      transform: scale(1.15);
    }
    
    /* BIO - Bottom-left corner → Center bottom */
    .hero-about {
      bottom: 3rem;
      left: 3rem;
      line-height: 1.5;
      font-size: 0.85rem;
      color: #ffffff;
      font-weight: 400;
      max-width: 350px;
    }
    
    .hero-container.centered .hero-about {
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 80px);
      font-size: 1rem;
      max-width: 600px;
      text-align: center;
    }
    
    /* NAVIGATION - Bottom-right corner → Center bottom */
    .nav-pills {
      bottom: 3rem;
      right: 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      align-items: flex-end;
    }
    
    .hero-container.centered .nav-pills {
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 180px);
      right: auto;
      flex-direction: row;
      gap: 3rem;
      align-items: center;
    }
    
    .nav-pills a {
      position: relative;
      display: inline-block;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    
    .hero-container.centered .nav-pills a {
      font-size: 1rem;
    }
    
    .nav-pills a:hover {
      opacity: 0.7;
    }
    
    .nav-pills a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ffffff;
    }

    @media (max-width: 1024px) {
      .hero-title {
        font-size: 2rem;
        top: 2rem;
        left: 2rem;
      }
      
      .hero-container.centered .hero-title {
        font-size: 3rem;
      }
      
      .contact-row {
        top: 2rem;
        right: 2rem;
        gap: 1.2rem;
      }
      
      .contact-row a {
        font-size: 20px;
      }
      
      .hero-container.centered .contact-row a {
        font-size: 28px;
      }
      
      .hero-about {
        bottom: 2rem;
        left: 2rem;
        font-size: 0.75rem;
        max-width: 280px;
      }
      
      .hero-container.centered .hero-about {
        font-size: 0.9rem;
        max-width: 500px;
      }
      
      .nav-pills {
        bottom: 2rem;
        right: 2rem;
        gap: 0.6rem;
      }
      
      .nav-pills a {
        font-size: 0.7rem;
      }
      
      .hero-container.centered .nav-pills a {
        font-size: 0.85rem;
      }
      
      .hero-container.centered .nav-pills {
        gap: 2rem;
      }
    }
    
    @media (max-width: 768px) {
      /* On mobile, revert to simple centered layout always */
      .hero-container {
        position: relative;
        mix-blend-mode: normal;
        background: rgba(0, 0, 0, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2rem 1.5rem;
      }
      
      .hero-title,
      .hero-about,
      .contact-row,
      .nav-pills {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        bottom: auto;
        transform: none;
      }
      
      .hero-title {
        font-size: 2rem;
        margin-bottom: 1rem;
        text-align: center;
      }
      
      .hero-about {
        font-size: 0.85rem;
        max-width: 100%;
        text-align: center;
        margin-bottom: 1.5rem;
      }
      
      .contact-row {
        justify-content: center;
        margin-bottom: 1.5rem;
        gap: 1.5rem;
      }
      
      .contact-row a {
        font-size: 24px;
      }
      
      .nav-pills {
        flex-direction: row;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      
      .nav-pills a {
        font-size: 0.75rem;
      }
    }

    /************************************************************
     * SECTION CARDS - SCROLL-REVEAL POPUPS
     ************************************************************/
    .section-card {
      position: relative;
      background-color: #000000;
      border: none;
      padding-bottom: 4rem;
    }
    
    /* Multi-column grid */
    .multi-column {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      padding: 1rem;
      padding-top: 200px;
    }
    
    .col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    /* Video with popup container */
    .video-row {
      position: relative;
      width: 100%;
      min-height: 300px;
      overflow: hidden; /* Crop popups at row boundaries */
    }
    
    .rect-video {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      border-radius: 4px;
      transition: transform 0.3s ease;
    }
    
    .rect-video:hover {
      transform: scale(1.02);
    }
    
    /* Popup shapes container - positioned absolutely within row */
    .popup-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    
    /* Individual popup shape */
    .popup-shape {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 8px;
      transform: scale(0);
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .popup-shape.visible {
      transform: scale(1);
      opacity: 1;
    }
    
    /* Different colors for demo */
    .popup-shape:nth-child(1) { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .popup-shape:nth-child(2) { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .popup-shape:nth-child(3) { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .popup-shape:nth-child(4) { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .popup-shape:nth-child(5) { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }

    /* Overlay Styling */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.95); /* Light overlay */
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .overlay.active {
      display: flex;
    }
    .overlay-content {
      position: relative;
      background-color: #ffffff; /* White background */
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      max-height: 85vh;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .overlay-content video {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 80vh;
      object-fit: contain;
    }
    .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background-color: #e0e0e0; /* Light gray */
      color: #2c2c2c; /* Dark text */
      border: none;
      font-size: 1rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .close-btn:hover {
      background-color: #c0c0c0; /* Darker gray on hover */
    }
  </style>
</head>pa
<body>
  <!-- PAGE WRAPPER for white side margins -->
  <div class="page-wrapper">

    <!-- STICKY HERO -->
    <div class="hero-container" id="heroContainer">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle"></h1>
        
        <div class="hero-about">
          Exploring procedural techniques in Houdini, motion design, and creative coding. Looking for technical artist internships.
        </div>
        
        <div class="contact-row">
          <a href="mailto:yonatan.gm@gmail.com" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="https://www.linkedin.com/in/yonatan-mamo-07b426137/" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://github.com/YonatanGM" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.behance.net/yonatanmamo" target="_blank" aria-label="Behance">
            <i class="fab fa-behance"></i>
          </a>
        </div>

        <div class="nav-pills">
          <a href="#card3D">Motion</a>
          <a href="#cardTouch">Typography</a>
          <a href="projects/spotify-uiux/index.html" target="_blank">App Design</a>
        </div>
      </div>
    </div>

    <!-- 3D CARD (Soft Neutral) -->
    <div class="section-card card-3d" id="card3D">
      <!-- Removed section-title as per user request -->
      <div class="multi-column" id="multiCol3D">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>
    </div>

    <!-- TOUCH CARD (Soft Neutral) -->
    <div class="section-card card-touch" id="cardTouch">
      <!-- Removed section-title as per user request -->
      <div class="multi-column" id="multiColTouch">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>
    </div>
  </div> <!-- end page-wrapper -->

  <!-- DESKTOP OVERLAY -->
  <div class="overlay" id="desktopOverlay">
    <div class="overlay-content">
      <button class="close-btn" id="closeBtn">X</button>
      <video id="overlayVideo" controls></video>
    </div>
  </div>

  <script>

    /*************************************************************
     * 1) ANIMATE HERO TITLE with “pop in” letters
     *************************************************************/
    const heroTitleEl = document.getElementById('heroTitle');
    const heroText = "HELLO, I'M YONATAN";

    function setHeroTitle(text) {
      heroTitleEl.innerHTML = "";
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const span = document.createElement('span');
        span.classList.add('letter');
        span.innerText = char === " " ? "\u00A0" : char;
        heroTitleEl.appendChild(span);
      }
    }

    setHeroTitle(heroText);
  </script>

  <script>
    /*************************************************************
     * 2) 4 CORNERS → CENTER CONVERGENCE
     *************************************************************/
    const heroContainer = document.getElementById('heroContainer');
    
    window.addEventListener('scroll', () => {
      if (window.scrollY < 100) {
        heroContainer.classList.add('centered');
      } else {
        heroContainer.classList.remove('centered');
      }
    });
    
    // Start centered on page load
    if (window.scrollY < 100) {
      heroContainer.classList.add('centered');
    }
  </script>

  <script>
    /*************************************************************
     * 3) CREATE VIDEOS WITH SCROLL-REVEAL POPUPS
     *************************************************************/
    const multiCol3D = document.getElementById('multiCol3D').children;
    const multiColTouch = document.getElementById('multiColTouch').children;

    // Video files
    const threeDVideos = [
      "video12.mp4", "video9.mp4", "video13.mp4", "mov32.mp4", "video11.mp4", 
      "mov30.mp4", "mov33.mp4", "mov22.mp4", "video0.mp4", "mov24.mp4",
      "video3.mp4", "video4.mp4", "video5.mp4", "video6.mp4", "video8.mp4", 
      "video10.mp4", "video14.mp4", "video15.mp4", "video16.mp4", "video17.mp4",
    ].reverse();

    const touchVideos = [
      "Movie99.mp4", "Movie10.mp4", "Movie11.mp4", "Movie18.mp4", "Movie21.mp4",
      "Movie27.mp4", "Movie31.mp4", "Movie41.mp4", "Movie56.mp4", "Movie62.mp4",
      "Movie9.mp4", "Movie42.mp4"
    ];
    
    // Define which videos have popups (for demo: first 3 of each section)
    const videosWithPopups = {
      0: 3,  // First 3D video has 3 popups
      1: 2,  // Second has 2 popups
      4: 4,  // Fifth has 4 popups
    };

    // Create video rows with popup containers
    function createVideoRow(videoFile, colIndex, videoIndex, hasPopups = 0) {
      const row = document.createElement('div');
      row.className = 'video-row';
      row.dataset.videoIndex = videoIndex;
      
      // Create video
      const vid = document.createElement('video');
      vid.className = 'rect-video';
      vid.src = `assets/${videoFile}`;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      
      row.appendChild(vid);
      
      // Add popup container if this video has popups
      if (hasPopups > 0) {
        const popupContainer = document.createElement('div');
        popupContainer.className = 'popup-container';
        row.dataset.popups = hasPopups;
        row.dataset.revealed = 0;
        
        // Create popup shapes
        for (let i = 0; i < hasPopups; i++) {
          const shape = document.createElement('div');
          shape.className = 'popup-shape';
          shape.dataset.index = i;
          
          // Random position within row (favor left side for black space)
          const x = Math.random() * 40; // 0-40% from left
          const y = Math.random() * 70 + 10; // 10-80% from top
          const size = 150 + Math.random() * 150; // 150-300px
          
          shape.style.left = `${x}%`;
          shape.style.top = `${y}%`;
          shape.style.width = `${size}px`;
          shape.style.height = `${size}px`;
          shape.style.zIndex = i;
          
          popupContainer.appendChild(shape);
        }
        
        row.appendChild(popupContainer);
      }
      
      // Hover to play
      vid.addEventListener('mouseenter', () => vid.play());
      vid.addEventListener('mouseleave', () => vid.pause());
      
      return row;
    }

    // Fill 3D videos
    threeDVideos.forEach((video, index) => {
      const hasPopups = videosWithPopups[index] || 0;
      const row = createVideoRow(video, index % 4, index, hasPopups);
      multiCol3D[index % 4].appendChild(row);
    });

    // Fill Touch videos  
    touchVideos.forEach((video, index) => {
      const row = createVideoRow(video, index % 4, index + threeDVideos.length, 0);
      multiColTouch[index % 4].appendChild(row);
    });

    const allVideoRows = document.querySelectorAll('.video-row');
  </script>

  <script>
    /*************************************************************
     * 4) SCROLL-BASED POPUP REVEALS
     *************************************************************/
    let lastScrollY = window.scrollY;
    
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const scrollDelta = scrollY - lastScrollY;
      
      // Check each video row with popups
      allVideoRows.forEach(row => {
        const popupCount = parseInt(row.dataset.popups) || 0;
        if (popupCount === 0) return;
        
        const rect = row.getBoundingClientRect();
        const rowCenter = rect.top + rect.height / 2;
        const viewportCenter = window.innerHeight / 2;
        
        // Is this row near viewport center?
        if (Math.abs(rowCenter - viewportCenter) < rect.height / 2) {
          const revealed = parseInt(row.dataset.revealed) || 0;
          
          // Scroll down to reveal more popups
          if (scrollDelta > 0 && revealed < popupCount) {
            const popups = row.querySelectorAll('.popup-shape');
            popups[revealed].classList.add('visible');
            row.dataset.revealed = revealed + 1;
          }
        }
      });
      
      lastScrollY = scrollY;
    });
  </script>

</body>
</html>
