<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Yonatan Mamo</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* BODY => Clean, minimal */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    html {
      scroll-behavior: smooth;
    }

    /************************************************************
     * A) PAGE WRAPPER => Full bleed
     ************************************************************/
    .page-wrapper {
      width: 100%;
      position: relative;
    }

    /************************************************************
     * BLEND MODE TEXT HEADER - 4 corners → center convergence
     ************************************************************/
    
    body {
      position: relative;
    }
    
    /* Page wrapper - content scrolls normally */
    .page-wrapper {
      position: relative;
      z-index: 1;
    }
    
    /* Hero container - manages all fixed elements */
    .hero-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      pointer-events: none;
      mix-blend-mode: difference;
    }
    
    /* Individual elements positioned at corners, converge to center */
    .hero-title,
    .hero-about,
    .contact-row,
    .nav-pills {
      position: fixed;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* Make interactive elements clickable */
    .hero-container a,
    .hero-container button {
      pointer-events: auto;
    }

    /* NAME - Top-left corner → Center top */
    .hero-title {
      top: 3rem;
      left: 3rem;
      font-size: 2.5rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1;
      white-space: nowrap;
    }
    
    .hero-container.centered .hero-title {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -180px);
      font-size: 4rem;
    }

    .hero-title .letter {
      display: inline-block;
      opacity: 0;
      animation: explodeLetter 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      position: relative;
    }
    
    /* Each letter explodes from different directions */
    .hero-title .letter:nth-child(1) { animation-delay: 0s; --explode-x: -200px; --explode-y: -100px; --explode-rotate: -180deg; }
    .hero-title .letter:nth-child(2) { animation-delay: 0.1s; --explode-x: 150px; --explode-y: -150px; --explode-rotate: 120deg; }
    .hero-title .letter:nth-child(3) { animation-delay: 0.2s; --explode-x: -180px; --explode-y: 120px; --explode-rotate: -90deg; }
    .hero-title .letter:nth-child(4) { animation-delay: 0.3s; --explode-x: 200px; --explode-y: -80px; --explode-rotate: 240deg; }
    .hero-title .letter:nth-child(5) { animation-delay: 0.4s; --explode-x: -120px; --explode-y: 150px; --explode-rotate: -220deg; }
    .hero-title .letter:nth-child(6) { animation-delay: 0.5s; --explode-x: 180px; --explode-y: 100px; --explode-rotate: 160deg; }
    .hero-title .letter:nth-child(7) { animation-delay: 0.6s; --explode-x: -150px; --explode-y: -120px; --explode-rotate: -270deg; }
    .hero-title .letter:nth-child(8) { animation-delay: 0.7s; --explode-x: 100px; --explode-y: 140px; --explode-rotate: 200deg; }
    .hero-title .letter:nth-child(9) { animation-delay: 0.8s; --explode-x: -100px; --explode-y: -140px; --explode-rotate: -120deg; }
    .hero-title .letter:nth-child(10) { animation-delay: 0.9s; --explode-x: 140px; --explode-y: -100px; --explode-rotate: 300deg; }
    .hero-title .letter:nth-child(11) { animation-delay: 1s; --explode-x: -140px; --explode-y: 100px; --explode-rotate: -150deg; }
    .hero-title .letter:nth-child(12) { animation-delay: 1.1s; --explode-x: 160px; --explode-y: 120px; --explode-rotate: 140deg; }
    .hero-title .letter:nth-child(13) { animation-delay: 1.2s; --explode-x: -160px; --explode-y: -90px; --explode-rotate: -200deg; }
    .hero-title .letter:nth-child(14) { animation-delay: 1.3s; --explode-x: 120px; --explode-y: 90px; --explode-rotate: 180deg; }
    .hero-title .letter:nth-child(15) { animation-delay: 1.4s; --explode-x: -90px; --explode-y: 130px; --explode-rotate: -100deg; }
    .hero-title .letter:nth-child(16) { animation-delay: 1.5s; --explode-x: 130px; --explode-y: -130px; --explode-rotate: 220deg; }
    .hero-title .letter:nth-child(17) { animation-delay: 1.6s; --explode-x: -130px; --explode-y: 80px; --explode-rotate: -240deg; }
    .hero-title .letter:nth-child(18) { animation-delay: 1.7s; --explode-x: 110px; --explode-y: -110px; --explode-rotate: 260deg; }

    @keyframes explodeLetter {
      0% {
        transform: translate(var(--explode-x), var(--explode-y)) rotate(var(--explode-rotate)) scale(0.2);
        opacity: 0;
      }
      60% {
        transform: translate(0, 0) rotate(calc(var(--explode-rotate) * 0.1)) scale(1.15);
        opacity: 1;
      }
      80% {
        transform: translate(0, 0) rotate(calc(var(--explode-rotate) * -0.05)) scale(0.95);
      }
      100% { 
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }
    }
    
    /* Subtle floating animation after letters settle */
    .hero-title .letter {
      animation: explodeLetter 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 floatLetter 3s ease-in-out 2s infinite;
    }
    
    @keyframes floatLetter {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      25% {
        transform: translateY(-3px) rotate(1deg);
      }
      50% {
        transform: translateY(0) rotate(0deg);
      }
      75% {
        transform: translateY(3px) rotate(-1deg);
      }
    }
    
    /* Different float timing for each letter */
    .hero-title .letter:nth-child(odd) {
      animation-delay: 0s, 2.2s;
    }
    .hero-title .letter:nth-child(even) {
      animation-delay: 0s, 2.5s;
    }
    
    /* CONTACT - Top-right corner → Center top */
    .contact-row {
      top: 3rem;
      right: 3rem;
      display: flex;
      gap: 1.5rem;
    }
    
    .hero-container.centered .contact-row {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -80px);
      right: auto;
      gap: 2.5rem;
    }

    .contact-row a {
      color: #ffffff;
      font-size: 24px;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .hero-container.centered .contact-row a {
      font-size: 32px;
    }
    
    .contact-row a:hover {
      transform: scale(1.15);
    }
    
    /* BIO - Bottom-left corner → Center bottom */
    .hero-about {
      bottom: 3rem;
      left: 3rem;
      line-height: 1.5;
      font-size: 0.85rem;
      color: #ffffff;
      font-weight: 400;
      max-width: 350px;
    }
    
    .hero-container.centered .hero-about {
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 80px);
      font-size: 1rem;
      max-width: 600px;
      text-align: center;
    }
    
    /* NAVIGATION - Bottom-right corner → Center bottom */
    .nav-pills {
      bottom: 3rem;
      right: 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      align-items: flex-end;
    }
    
    .hero-container.centered .nav-pills {
      bottom: 50%;
      left: 50%;
      transform: translate(-50%, 180px);
      right: auto;
      flex-direction: row;
      gap: 3rem;
      align-items: center;
    }
    
    .nav-pills a {
      position: relative;
      display: inline-block;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    
    .hero-container.centered .nav-pills a {
      font-size: 1rem;
    }
    
    .nav-pills a:hover {
      opacity: 0.7;
    }
    
    .nav-pills a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ffffff;
    }

    @media (max-width: 1024px) {
      .hero-title {
        font-size: 2rem;
        top: 2rem;
        left: 2rem;
      }
      
      .hero-container.centered .hero-title {
        font-size: 3rem;
      }
      
      .contact-row {
        top: 2rem;
        right: 2rem;
        gap: 1.2rem;
      }
      
      .contact-row a {
        font-size: 20px;
      }
      
      .hero-container.centered .contact-row a {
        font-size: 28px;
      }
      
      .hero-about {
        bottom: 2rem;
        left: 2rem;
        font-size: 0.75rem;
        max-width: 280px;
      }
      
      .hero-container.centered .hero-about {
        font-size: 0.9rem;
        max-width: 500px;
      }
      
      .nav-pills {
        bottom: 2rem;
        right: 2rem;
        gap: 0.6rem;
      }
      
      .nav-pills a {
        font-size: 0.7rem;
      }
      
      .hero-container.centered .nav-pills a {
        font-size: 0.85rem;
      }
      
      .hero-container.centered .nav-pills {
        gap: 2rem;
      }
    }
    
    @media (max-width: 768px) {
      /* On mobile, revert to simple centered layout always */
      .hero-container {
        position: relative;
        mix-blend-mode: normal;
        background: rgba(0, 0, 0, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2rem 1.5rem;
      }
      
      .hero-title,
      .hero-about,
      .contact-row,
      .nav-pills {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
        bottom: auto;
        transform: none;
      }
      
      .hero-title {
        font-size: 2rem;
        margin-bottom: 1rem;
        text-align: center;
      }
      
      .hero-about {
        font-size: 0.85rem;
        max-width: 100%;
        text-align: center;
        margin-bottom: 1.5rem;
      }
      
      .contact-row {
        justify-content: center;
        margin-bottom: 1.5rem;
        gap: 1.5rem;
      }
      
      .contact-row a {
        font-size: 24px;
      }
      
      .nav-pills {
        flex-direction: row;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      
      .nav-pills a {
        font-size: 0.75rem;
      }
    }

    /************************************************************
     * SECTION CARDS - SCROLL-SHUFFLE VIEWPORT
     ************************************************************/
    .section-card {
      position: relative;
      min-height: 500vh; /* Long scroll for shuffling effect */
      background-color: #000000;
      border: none;
    }
    
    /* Fixed viewport for jumbled video cards */
    .video-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    
    /* Video card - jumbled, overlapping */
    .video-card {
      position: absolute;
      width: clamp(250px, 30vw, 400px);
      height: auto;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      cursor: pointer;
      opacity: 0;
    }
    
    .video-card.visible {
      opacity: 1;
    }
    
    .video-card video {
      width: 100%;
      height: auto;
      display: block;
    }
    
    .video-card:hover {
      z-index: 100 !important;
      transform: scale(1.08) !important;
      box-shadow: 0 20px 60px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>pa
<body>
  <!-- PAGE WRAPPER for white side margins -->
  <div class="page-wrapper">

    <!-- STICKY HERO -->
    <div class="hero-container" id="heroContainer">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle"></h1>
        
        <div class="hero-about">
          Exploring procedural techniques in Houdini, motion design, and creative coding. Looking for technical artist internships.
        </div>
        
        <div class="contact-row">
          <a href="mailto:yonatan.gm@gmail.com" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="https://www.linkedin.com/in/yonatan-mamo-07b426137/" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://github.com/YonatanGM" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.behance.net/yonatanmamo" target="_blank" aria-label="Behance">
            <i class="fab fa-behance"></i>
          </a>
        </div>

        <div class="nav-pills">
          <a href="#card3D">Motion</a>
          <a href="#cardTouch">Typography</a>
          <a href="projects/spotify-uiux/index.html" target="_blank">App Design</a>
        </div>
      </div>
    </div>

    <!--  SCROLL-SHUFFLE VIEWPORT -->
    <div class="section-card">
      <div class="video-viewport" id="videoViewport"></div>
    </div>
  </div> <!-- end page-wrapper -->

  <script>

    /*************************************************************
     * 1) ANIMATE HERO TITLE with “pop in” letters
     *************************************************************/
    const heroTitleEl = document.getElementById('heroTitle');
    const heroText = "HELLO, I'M YONATAN";

    function setHeroTitle(text) {
      heroTitleEl.innerHTML = "";
      let delay = 0;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const span = document.createElement('span');
        span.classList.add('letter');
        span.style.animationName = 'popIn';
        span.style.animationDelay = delay + 's';
        span.innerText = char === " " ? "\u00A0" : char;
        heroTitleEl.appendChild(span);
        delay += 0.05;
      }
    }

    setHeroTitle(heroText);
  </script>

  <script>
    /*************************************************************
     * 2) 4 CORNERS → CENTER CONVERGENCE
     *************************************************************/
    const heroContainer = document.getElementById('heroContainer');
    
    window.addEventListener('scroll', () => {
      if (window.scrollY < 100) {
        heroContainer.classList.add('centered');
      } else {
        heroContainer.classList.remove('centered');
      }
    });
    
    // Start centered on page load
    if (window.scrollY < 100) {
      heroContainer.classList.add('centered');
    }
  </script>

  <script>
    /*************************************************************
     * 3) SCROLL-SHUFFLE VIDEO VIEWPORT
     *************************************************************/
    const viewport = document.getElementById('videoViewport');
    
    // All videos combined
    const allVideos = [
      "video12.mp4", "video9.mp4", "video13.mp4", "mov32.mp4", "video11.mp4",
      "mov30.mp4", "mov33.mp4", "mov22.mp4", "video0.mp4", "mov24.mp4",
      "video3.mp4", "video4.mp4", "video5.mp4", "video6.mp4", "video8.mp4",
      "video10.mp4", "video14.mp4", "video15.mp4", "video16.mp4", "video17.mp4",
      "Movie99.mp4", "Movie10.mp4", "Movie11.mp4", "Movie18.mp4", "Movie21.mp4",
      "Movie27.mp4", "Movie31.mp4", "Movie41.mp4", "Movie56.mp4", "Movie62.mp4",
      "Movie9.mp4", "Movie42.mp4"
    ];
    
    const CARDS_VISIBLE = 6;
    const videoCards = [];
    let currentVideoIndex = 0;
    let lastScrollY = 0;
    let isShuffling = false;
    
    // Create video cards
    for (let i = 0; i < CARDS_VISIBLE; i++) {
      const card = document.createElement('div');
      card.className = 'video-card';
      
      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.loop = true;
      video.preload = 'metadata';
      video.src = `assets/${allVideos[i % allVideos.length]}`;
      
      card.appendChild(video);
      viewport.appendChild(card);
      videoCards.push({ 
        element: card, 
        video: video, 
        videoIndex: i % allVideos.length 
      });
      
      // Hover to play
      card.addEventListener('mouseenter', () => video.play());
      card.addEventListener('mouseleave', () => video.pause());
      
      // Tap to play on mobile
      card.addEventListener('touchstart', () => {
        if (video.paused) video.play();
        else video.pause();
      });
    }
    
    // Random position generator
    function getRandomPosition(index, total) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cardWidth = Math.min(400, vw * 0.3);
      const cardHeight = cardWidth * 0.6;
      
      // Create scattered positions with some spacing
      const angle = (index / total) * Math.PI * 2 + Math.random() * 0.5;
      const radius = Math.min(vw, vh) * (0.15 + Math.random() * 0.2);
      
      const centerX = vw / 2;
      const centerY = vh / 2;
      
      const x = centerX + Math.cos(angle) * radius - cardWidth / 2;
      const y = centerY + Math.sin(angle) * radius - cardHeight / 2;
      
      // Constrain to viewport with margins
      const margin = 30;
      const finalX = Math.max(margin, Math.min(x, vw - cardWidth - margin));
      const finalY = Math.max(margin, Math.min(y, vh - cardHeight - margin));
      
      return { x: finalX, y: finalY };
    }
    
    // Shuffle cards to new positions
    function shuffleCards(animate = true) {
      videoCards.forEach((card, index) => {
        const pos = getRandomPosition(index, CARDS_VISIBLE);
        const rotation = (Math.random() - 0.5) * 20;
        const scale = 0.85 + Math.random() * 0.3;
        const zIndex = Math.floor(Math.random() * CARDS_VISIBLE);
        
        if (animate) {
          card.element.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
        } else {
          card.element.style.transition = 'none';
        }
        
        card.element.style.transform = `translate(${pos.x}px, ${pos.y}px) rotate(${rotation}deg) scale(${scale})`;
        card.element.style.zIndex = zIndex;
        
        setTimeout(() => {
          card.element.classList.add('visible');
        }, index * 50);
      });
    }
    
    // Initial shuffle
    shuffleCards(false);
    
    // Scroll handler - shuffle on scroll movement
    let scrollTimeout;
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const scrollDelta = Math.abs(scrollY - lastScrollY);
      
      // Detect scroll movement (threshold 100px)
      if (scrollDelta > 100 && !isShuffling) {
        isShuffling = true;
        
        // Shuffle to new arrangement
        shuffleCards(true);
        
        // Cycle to next video set
        if (scrollY > lastScrollY) {
          // Scrolling down - load next video in rotation
          const oldestCard = videoCards.shift();
          videoCards.push(oldestCard);
          
          currentVideoIndex = (currentVideoIndex + 1) % allVideos.length;
          oldestCard.video.src = `assets/${allVideos[currentVideoIndex]}`;
          oldestCard.videoIndex = currentVideoIndex;
        }
        
        lastScrollY = scrollY;
        
        setTimeout(() => {
          isShuffling = false;
        }, 700);
      }
    });
  </script>

</body>
</html>
