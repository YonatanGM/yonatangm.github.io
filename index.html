<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Yonatan Mamo</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* BODY => Clean, minimal */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    html {
      scroll-behavior: smooth;
    }

    /************************************************************
     * A) PAGE WRAPPER => Full bleed
     ************************************************************/
    .page-wrapper {
      width: 100%;
      position: relative;
    }

    /************************************************************
     * BLEND MODE TEXT HEADER - Simple centered statement
     ************************************************************/
    
    body {
      position: relative;
    }
    
    /* Page wrapper - content scrolls normally */
    .page-wrapper {
      position: relative;
      z-index: 1;
    }
    
    /* Hero container - centered, simple */
    .hero-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      mix-blend-mode: difference;
      text-align: center;
      width: 100%;
      padding: 0 2rem;
    }
    
    .hero-content {
      position: relative;
    }
    
    /* Make interactive elements clickable */
    .hero-container a,
    .hero-container button {
      pointer-events: auto;
    }

    /* Just the name - HUGE, bold, centered */
    .hero-title {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.04em;
      margin: 0;
      line-height: 0.9;
      white-space: nowrap;
    }

    .hero-title .letter {
      display: inline-block;
      transform: scale(0.3) rotate(-15deg);
      opacity: 0;
      animation: bouncyPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    
    /* Stagger each letter */
    .hero-title .letter:nth-child(1) { animation-delay: 0.1s; }
    .hero-title .letter:nth-child(2) { animation-delay: 0.2s; }
    .hero-title .letter:nth-child(3) { animation-delay: 0.3s; }
    .hero-title .letter:nth-child(4) { animation-delay: 0.4s; }
    .hero-title .letter:nth-child(5) { animation-delay: 0.5s; }
    .hero-title .letter:nth-child(6) { animation-delay: 0.6s; }
    .hero-title .letter:nth-child(7) { animation-delay: 0.7s; }

    @keyframes bouncyPop {
      0% {
        transform: scale(0.3) rotate(-15deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.1) rotate(5deg);
        opacity: 1;
      }
      70% {
        transform: scale(0.95) rotate(-2deg);
      }
      85% {
        transform: scale(1.02) rotate(1deg);
      }
      100% { 
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    
    /* Everything else hidden initially, fades in on scroll */
    .hero-about,
    .contact-row,
    .nav-pills {
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    
    .hero-container.show-info .hero-about,
    .hero-container.show-info .contact-row,
    .hero-container.show-info .nav-pills {
      opacity: 1;
    }
    
    /* Bio - small, centered below name */
    .hero-about {
      line-height: 1.6;
      font-size: 0.9rem;
      color: #ffffff;
      margin: 2rem auto 1.5rem auto;
      font-weight: 400;
      max-width: 600px;
    }

    /* Contact icons - centered */
    .contact-row {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .contact-row a {
      color: #ffffff;
      font-size: 26px;
      text-decoration: none;
      transition: transform 0.3s ease;
    }
    
    .contact-row a:hover {
      transform: scale(1.15);
    }
    
    /* Navigation - horizontal centered */
    .nav-pills {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
    }
    
    .nav-pills a {
      position: relative;
      display: inline-block;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }
    
    .nav-pills a:hover {
      opacity: 0.7;
    }
    
    .nav-pills a.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ffffff;
    }

    @media (max-width: 1024px) {
      .hero-title {
        font-size: clamp(2.5rem, 8vw, 5rem);
      }
      
      .hero-about {
        font-size: 0.85rem;
        margin-top: 1.5rem;
      }
      
      .contact-row {
        gap: 1.5rem;
      }
      
      .contact-row a {
        font-size: 22px;
      }
      
      .nav-pills {
        gap: 2rem;
      }
      
      .nav-pills a {
        font-size: 0.75rem;
      }
    }
    
    @media (max-width: 768px) {
      .hero-container {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        mix-blend-mode: normal;
        background: rgba(0, 0, 0, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2rem 1.5rem;
      }
      
      .hero-about,
      .contact-row,
      .nav-pills {
        opacity: 1 !important;
      }
      
      .hero-title {
        font-size: clamp(2rem, 10vw, 3rem);
        margin-bottom: 1.5rem;
      }
      
      .hero-about {
        font-size: 0.85rem;
        margin: 0 auto 1.5rem auto;
      }
      
      .contact-row {
        gap: 1.5rem;
        margin-bottom: 1.5rem;
      }
      
      .contact-row a {
        font-size: 24px;
      }
      
      .nav-pills {
        gap: 1.5rem;
        flex-wrap: wrap;
      }
      
      .nav-pills a {
        font-size: 0.75rem;
      }
    }

    /************************************************************
     * SECTION CARDS
     ************************************************************/
    .section-card {
      position: relative;
      margin-top: -40px;
      padding-top: 8rem;
      padding-bottom: 4rem;
      border-radius: 0;
      overflow: hidden;
      color: #ffffff;
      background-color: #000000; /* Keep black background for blend mode */
      border: none;
    }
    
    /* Add spacing for first section to clear fixed header */
    .section-card:first-of-type {
      padding-top: 150px;
    }

    /* Removed section titles as per user request */

    /* Adjusted multi-column layout for better spacing */
    .multi-column {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem;
      padding-top: 3rem;
    }
    
    /* Extra padding for first section to clear fixed header */
    #card3D .multi-column {
      padding-top: 200px;
    }
    .col {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Responsive Columns */
    @media (max-width: 767px) {
      .col {
        width: 100%;
      }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .col {
        width: 50%;
      }
    }
    @media (min-width: 1024px) {
      .col {
        width: 25%;
      }
    }

    /* Enhanced Video Layout with Sliding Door Effect */
    .video-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 0px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      background-color: #000;
    }
    
    .rect-video {
      width: 100%;
      cursor: pointer;
      display: block;
      transition: transform 0.3s;
    }

    .rect-video:hover {
      transform: scale(1.05);
    }
    
    /* Sliding door panels */
    .video-wrapper::before,
    .video-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: #000;
      z-index: 2;
      transition: transform 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .video-wrapper::before {
      left: 0;
      transform: translateX(0);
    }
    
    .video-wrapper::after {
      right: 0;
      transform: translateX(0);
    }
    
    /* When video comes into view, doors slide open */
    .video-wrapper.revealed::before {
      transform: translateX(-100%);
    }
    
    .video-wrapper.revealed::after {
      transform: translateX(100%);
    }
    
    /* Add glitch effect to video on reveal */
    .video-wrapper.revealed .rect-video {
      animation: videoGlitch 0.3s ease-in-out 0.4s;
    }
    
    @keyframes videoGlitch {
      0%, 100% {
        transform: translate(0, 0);
      }
      20% {
        transform: translate(-3px, 2px);
      }
      40% {
        transform: translate(3px, -2px);
      }
      60% {
        transform: translate(-2px, -1px);
      }
      80% {
        transform: translate(2px, 1px);
      }
    }

    /* Overlay Styling */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.95); /* Light overlay */
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .overlay.active {
      display: flex;
    }
    .overlay-content {
      position: relative;
      background-color: #ffffff; /* White background */
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      max-height: 85vh;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .overlay-content video {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 80vh;
      object-fit: contain;
    }
    .close-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background-color: #e0e0e0; /* Light gray */
      color: #2c2c2c; /* Dark text */
      border: none;
      font-size: 1rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .close-btn:hover {
      background-color: #c0c0c0; /* Darker gray on hover */
    }
  </style>
</head>pa
<body>
  <!-- PAGE WRAPPER for white side margins -->
  <div class="page-wrapper">

    <!-- STICKY HERO -->
    <div class="hero-container" id="heroContainer">
      <div class="hero-content">
        <h1 class="hero-title" id="heroTitle"></h1>
        
        <div class="hero-about">
          Exploring procedural techniques in Houdini, motion design, and creative coding. Looking for technical artist internships.
        </div>
        
        <div class="contact-row">
          <a href="mailto:yonatan.gm@gmail.com" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="https://www.linkedin.com/in/yonatan-mamo-07b426137/" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://github.com/YonatanGM" target="_blank" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.behance.net/yonatanmamo" target="_blank" aria-label="Behance">
            <i class="fab fa-behance"></i>
          </a>
        </div>

        <div class="nav-pills">
          <a href="#card3D">Motion</a>
          <a href="#cardTouch">Typography</a>
          <a href="projects/spotify-uiux/index.html" target="_blank">App Design</a>
        </div>
      </div>
    </div>

    <!-- 3D CARD (Soft Neutral) -->
    <div class="section-card card-3d" id="card3D">
      <!-- Removed section-title as per user request -->
      <div class="multi-column" id="multiCol3D">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>
    </div>

    <!-- TOUCH CARD (Soft Neutral) -->
    <div class="section-card card-touch" id="cardTouch">
      <!-- Removed section-title as per user request -->
      <div class="multi-column" id="multiColTouch">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>
    </div>
  </div> <!-- end page-wrapper -->

  <!-- DESKTOP OVERLAY -->
  <div class="overlay" id="desktopOverlay">
    <div class="overlay-content">
      <button class="close-btn" id="closeBtn">X</button>
      <video id="overlayVideo" controls></video>
    </div>
  </div>

  <script>

    /*************************************************************
     * 1) ANIMATE HERO TITLE with “pop in” letters
     *************************************************************/
    const heroTitleEl = document.getElementById('heroTitle');
    const heroText = "YONATAN";

    function setHeroTitle(text) {
      heroTitleEl.innerHTML = "";
      let delay = 0;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const span = document.createElement('span');
        span.classList.add('letter');
        span.style.animationName = 'popIn';
        span.style.animationDelay = delay + 's';
        span.innerText = char === " " ? "\u00A0" : char;
        heroTitleEl.appendChild(span);
        delay += 0.05;
      }
    }

    setHeroTitle(heroText);
  </script>

  <script>
    /************************************************************
     * 2) BLEND MODE HEADER - Show info on scroll
     *************************************************************/
    const heroContainer = document.getElementById('heroContainer');
    
    window.addEventListener('scroll', () => {
      if (window.scrollY > 200) {
        heroContainer.classList.add('show-info');
      } else {
        heroContainer.classList.remove('show-info');
      }
    });
  </script>

  <script>
    /*************************************************************
     * 3) CREATE & LAZY-LOAD videos for 3D & Touch
     *************************************************************/
    const threeDCount = 18;
    const touchCount = 18;
    const multiCol3D = document.getElementById('multiCol3D').children;
    const multiColTouch = document.getElementById('multiColTouch').children;

    // Hardcoded arrays with video file names (just the base names)
    const threeDVideos = [
      "video12.mp4", "video9.mp4",  "video13.mp4", "mov32.mp4", "video11.mp4", "mov30.mp4", "mov33.mp4", "mov22.mp4",
      "video0.mp4", /* "video1.mp4" */, "mov24.mp4",
      "video3.mp4", "video4.mp4", "video5.mp4",
      "video6.mp4", "video8.mp4", "video10.mp4",
      /*"video7.mp4"*/, "video14.mp4",
      "video15.mp4", "video16.mp4", "video17.mp4",
    ].reverse();

    const touchVideos = [
      "Movie99.mp4",
      "Movie10.mp4",
      "Movie11.mp4",
      "Movie18.mp4",
      "Movie21.mp4",
      "Movie27.mp4",
      "Movie31.mp4",
      // "Movie40.mp4",
      "Movie41.mp4",
      "Movie56.mp4",
      "Movie62.mp4",
      "Movie9.mp4",
      "Movie42.mp4"
    ];

    // Fill 3D videos
    threeDVideos.forEach((video, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'video-wrapper';
      
      const vid = document.createElement('video');
      vid.className = 'rect-video';
      vid.dataset.src = `assets/${video}`; // Append "assets/" to the filename
      vid.preload = 'auto';
      vid.muted = true;
      vid.playsInline = true;
      vid.loading = 'lazy';
      
      wrapper.appendChild(vid);
      multiCol3D[index % 4].appendChild(wrapper); // Distribute videos across columns
    });

    // Fill Touch videos
    touchVideos.forEach((video, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'video-wrapper';
      
      const vid = document.createElement('video');
      vid.className = 'rect-video';
      vid.dataset.src = `assets/${video}`; // Append "assets/" to the filename
      vid.preload = 'auto';
      vid.muted = true;
      vid.playsInline = true;
      vid.loading = 'lazy';
      
      wrapper.appendChild(vid);
      multiColTouch[index % 4].appendChild(wrapper); // Distribute videos across columns
    });

    const allVids = document.querySelectorAll('.rect-video');
    const allWrappers = document.querySelectorAll('.video-wrapper');
  </script>

  <script>
    /*************************************************************
     * 4) LAZY LOADING => IntersectionObserver
     *************************************************************/
    const lazyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const vid = entry.target;
          if (vid.dataset.src) {
            vid.src = vid.dataset.src;
            vid.load();
          }
          lazyObserver.unobserve(vid);
        }
      });
    });
    allVids.forEach(vid => lazyObserver.observe(vid));
  </script>

  <script>
    /*************************************************************
     * 4.5) SLIDING DOOR REVEAL => IntersectionObserver
     *************************************************************/
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry, index) => {
        if (entry.isIntersecting) {
          // Stagger the reveal slightly
          setTimeout(() => {
            entry.target.classList.add('revealed');
          }, entry.target.dataset.delay || 0);
          revealObserver.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.2, // Trigger when 20% of video is visible
      rootMargin: '0px'
    });
    
    // Add staggered delays and observe
    allWrappers.forEach((wrapper, index) => {
      wrapper.dataset.delay = (index % 4) * 150; // Stagger by column
      revealObserver.observe(wrapper);
    });
  </script>

  <script>
    /*************************************************************
     * 5) SCROLL TILT => only on smaller screens
     *************************************************************/
    function enableTiltForNonDesktop() {
      window.addEventListener('scroll', tiltHandler);
    }
    function tiltHandler() {
      allVids.forEach(video => {
        const rect = video.getBoundingClientRect();
        const distance = window.innerHeight - rect.bottom;
        const maxDistance = 300.0;
        let angle = (distance / maxDistance) * 10;
        angle = Math.max(0, Math.min(200, angle));
        video.style.transform = `rotateY(${angle}deg)`;
      });
    }
    enableTiltForNonDesktop();
    window.addEventListener('resize', enableTiltForNonDesktop);
  </script>

  <script>
    /*************************************************************
     * 6) HOVER-TO-PLAY => Desktop
     *************************************************************/
    allVids.forEach(video => {
      video.addEventListener('mouseover', e => {
        e.currentTarget.muted = true;
        try { e.currentTarget.play(); }
        catch(err) { if (err.name !== "AbortError") console.log(err); }
      });
      video.addEventListener('mouseleave', e => {
        try { e.currentTarget.pause(); }
        catch(err) { if (err.name !== "AbortError") console.log(err); }
      });
    });
  </script>

  <script>
    /*************************************************************
     * 7) DESKTOP OVERLAY => click
     *************************************************************/
    const desktopOverlay = document.getElementById('desktopOverlay');
    const overlayVideo = document.getElementById('overlayVideo');
    const closeBtn = document.getElementById('closeBtn');

    function handleDesktopClick(e) {
      if (window.innerWidth >= 1024) {
        desktopOverlay.classList.add('active');
        overlayVideo.src = e.currentTarget.src;
        overlayVideo.play();
      }
    }
    allVids.forEach(video => {
      video.addEventListener('click', handleDesktopClick);
    });

    closeBtn.addEventListener('click', () => {
      desktopOverlay.classList.remove('active');
      overlayVideo.pause();
      overlayVideo.src = "";
    });
  </script>

  <script>
    /*************************************************************
     * 8) MOBILE PRESS-AND-HOLD => play
     *************************************************************/
    let mediaQuery = window.matchMedia('(max-width: 600px)');
    function handleMobileHold(mq) {
      allVids.forEach(video => {
        // Remove old
        video.removeEventListener('touchstart', onTouchStart);
        video.removeEventListener('touchmove', onTouchMove);
        video.removeEventListener('touchend', onTouchEnd);
        if (mq.matches) {
          video.addEventListener('touchstart', onTouchStart);
          video.addEventListener('touchmove', onTouchMove);
          video.addEventListener('touchend', onTouchEnd);
        }
      });
    }

    let timer = null;
    let startX = 0, startY = 0;
    const threshold = 10;
    const holdTime = 500;
    let isPlaying = false;

    function onTouchStart(e) {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
      isPlaying = false;

      const vid = e.currentTarget;
      timer = setTimeout(() => {
        try {
          vid.play();
          isPlaying = true;
        } catch(err) { if (err.name !== "AbortError") console.log(err); }
      }, holdTime);
    }

    function onTouchMove(e) {
      const touch = e.touches[0];
      const deltaX = Math.abs(touch.clientX - startX);
      const deltaY = Math.abs(touch.clientY - startY);
      if (deltaX > threshold || deltaY > threshold) {
        clearTimeout(timer);
      }
    }

    function onTouchEnd(e) {
      clearTimeout(timer);
      const vid = e.currentTarget;
      if (isPlaying) {
        try { vid.pause(); }
        catch(err) { if (err.name !== "AbortError") console.log(err); }
      }
      isPlaying = false;
    }

    handleMobileHold(mediaQuery);
    mediaQuery.addEventListener('change', handleMobileHold);
  </script>
</body>
</html>
